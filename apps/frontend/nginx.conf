server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/users {
        proxy_pass http://users:8080/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/tasks {
        rewrite ^/api/tasks(/users.*)$ $1 break;
        proxy_pass http://tasks:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/users {
        proxy_pass http://users:8080/q/health;
    }

    location /health/tasks {
        proxy_pass http://tasks:8081/q/health;
    }
}
