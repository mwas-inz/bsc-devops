quarkus.application.name=task-archiver
quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.schema-management.strategy=update

quarkus.container-image.group=mateuszwas
quarkus.container-image.name=task-archiver
quarkus.container-image.tag=1.0.0

quarkus.kubernetes.idempotent=true
quarkus.kubernetes.part-of=bsc-devops
quarkus.kubernetes.name=task-archiver
quarkus.kubernetes.version=1.0.0

# --- Observability: structured logging + OpenTelemetry (INZ-24, INZ-25) ----
# Structured JSON console logging via the core quarkus-logging-json extension
# (BOM-managed, versioned with Quarkus). Enabled by default in every profile;
# disabled in dev/test for readable local logs, so only prod emits JSON for
# Loki/OTLP to index. The Quarkus OTel extension injects the MDC keys
# traceId/spanId/sampled automatically; in the default format they appear under
# the JSON "mdc" object.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# OpenTelemetry log signal: export logs over OTLP to the Collector (build-time).
quarkus.otel.logs.enabled=true
quarkus.otel.resource.attributes=service.namespace=bsc-devops
