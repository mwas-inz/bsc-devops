pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'io.quarkus' version "${quarkusPlatformVersion}"
        id 'io.freefair.lombok' version "${lombokPluginVersion}"
    }
}

rootProject.name = 'bsc-devops'

include('apps:tasks')
include('apps:users')
include('apps:task-archiver')
