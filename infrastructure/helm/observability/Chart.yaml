apiVersion: v2
name: observability
description: >-
  LGTM observability backend (Loki, Grafana, Tempo, Prometheus) for the
  bsc-devops thesis platform. Bundles the official community charts as
  dependencies so the whole stack installs as one release into the
  observability namespace (ADR-0007).
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: loki
    version: 7.0.0
    repository: https://grafana.github.io/helm-charts
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts
  - name: prometheus
    version: 29.10.1
    repository: https://prometheus-community.github.io/helm-charts
