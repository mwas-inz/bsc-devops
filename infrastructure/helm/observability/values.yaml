# LGTM observability backend — tuned for a single-node local k3d cluster.
# Subchart values are nested under each dependency name (loki / tempo / grafana /
# prometheus). Storage is ephemeral (emptyDir) on purpose: this is a demo/thesis
# stack, not a durable store. Clean service names (loki/tempo/grafana) are set via
# fullnameOverride so downstream config (OTel Collector, Grafana datasources) and
# the thesis listings can reference them directly.

# ---------------------------------------------------------------------------
# Loki (logs) — SingleBinary mode, filesystem storage, caches off.
# The chart defaults to SimpleScalable + memcached caches + empty schemaConfig,
# none of which fit one small node, so every relevant knob is overridden here.
# ---------------------------------------------------------------------------
loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  singleBinary:
    replicas: 1
    # Loki's container has a read-only root fs and writes its data/ruler dirs under
    # /var/loki, so it needs a writable volume there. A small local-path PVC (the
    # provisioner k3d ships, same as Postgres) is the simplest reliable option.
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # Disable the scalable deployment targets — SingleBinary handles everything.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  # Memcached caches request multiple GB by default — off for local.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  # No nginx gateway: clients talk to the loki service directly on :3100.
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  minio:
    enabled: false

# ---------------------------------------------------------------------------
# Tempo (traces) — single binary, local storage. The chart already enables the
# OTLP receiver (grpc :4317 / http :4318) by default.
# ---------------------------------------------------------------------------
tempo:
  fullnameOverride: tempo
  persistence:
    enabled: false
  # Container settings live under the nested `tempo:` key of the subchart
  # (.Values.tempo.resources). A top-level `resources:` here is silently ignored,
  # which left the pod BestEffort with no limits (found by measure-resources.sh).
  tempo:
    # Sized from measurement (measure-resources.sh, 100% trace sampling, ~430 req/s):
    # before this change ~1.3Gi under load and memory.peak 2.2Gi; with the settings
    # below ~200Mi under load, spikes to ~800Mi on block completion, memory.peak
    # ~970Mi. The limit leaves ~50% headroom above that peak.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1536Mi
    # The 1 GiB heap ballast is a pre-Go 1.19 GC trick; GOMEMLIMIT replaces it and
    # makes the GC work harder before the container reaches its memory limit.
    memBallastSizeMbs: 0
    extraEnv:
      - name: GOMEMLIMIT
        value: 850MiB
    # Cut smaller blocks sooner (defaults: 500MB / 30m) — completing a block holds
    # it in memory, so this caps the post-load spike seen in memory.peak.
    ingester:
      max_block_bytes: 104857600
      max_block_duration: 5m

# ---------------------------------------------------------------------------
# Loki API ingress — Loki has no web UI; this exposes its HTTP API at
# loki.localhost (for LogCLI/curl). Rendered by templates/loki-ingress.yaml.
# ---------------------------------------------------------------------------
lokiIngress:
  enabled: true
  host: loki.localhost

# ---------------------------------------------------------------------------
# Grafana (visualization) — single pane of glass. Datasources and dashboards
# are provisioned as code in Stage 4 (INZ-26); here we only stand it up.
# ---------------------------------------------------------------------------
grafana:
  fullnameOverride: grafana
  # Admin credentials come from a Secret, never from committed values. Create the
  # grafana-admin Secret out-of-band with a random password (see README); for the
  # GitOps flow it should be a Sealed Secret (ADR-0016), wired in Stage 5.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.localhost
  # Grafana container measured at ~167Mi idle. The chart derives GOMEMLIMIT from
  # limits.memory, so the heap settles higher as the limit grows.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 320Mi
  # Sidecar auto-imports any ConfigMap labelled grafana_dashboard (INZ-26).
  # It had no requests of its own (~71Mi measured), so the pod as a whole used
  # more memory than it reserved.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 80Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: /tmp/dashboards
  # Datasources provisioned as code, with cross-pillar correlation wired in:
  # Loki -> Tempo (derivedFields on the trace_id structured-metadata field),
  # Tempo -> Loki (tracesToLogsV2) and Tempo -> Prometheus (serviceMap).
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus
          isDefault: true
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki:3100
          jsonData:
            derivedFields:
              - name: trace_id
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                url: "${__value.raw}"
                urlDisplayLabel: View trace
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              filterByTraceID: true
              tags:
                - key: service.name
                  value: service_name
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true

# ---------------------------------------------------------------------------
# Prometheus (metrics) — standalone server only. The "lean" decision (D2 / ADR-0007)
# drops node-exporter and kube-state-metrics; the server scrapes the application
# pods directly via their existing prometheus.io/scrape annotations.
# ---------------------------------------------------------------------------
prometheus:
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  server:
    fullnameOverride: prometheus
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - prometheus.localhost
    persistentVolume:
      enabled: false
    retention: "24h"
    # Server measured at ~316Mi idle (above the former 256Mi request); the limit
    # leaves room for series growth over the 24h retention window.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
  configmapReload:
    prometheus:
      # Config-reloader sidecar (~8Mi) — previously without requests/limits.
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

# ---------------------------------------------------------------------------
# OpenTelemetry Collector (INZ-22) — single Deployment "gateway" that receives
# OTLP traces + logs from the applications and fans them out to Tempo and Loki.
# The pipeline config lives in files/otel-collector-config.yaml (mounted via a
# ConfigMap) so it stays a standalone, otelcol-validatable file.
# ---------------------------------------------------------------------------
collector:
  enabled: true
  replicas: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.154.0"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
