{{- if .Values.frontend.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: {{ include "bsc-devops.namespace" . }}
  labels:
    {{- include "bsc-devops.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-tasks
  namespace: {{ include "bsc-devops.namespace" . }}
  labels:
    {{- include "bsc-devops.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api/tasks
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: users-api
  namespace: {{ include "bsc-devops.namespace" . }}
  labels:
    {{- include "bsc-devops.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "bsc-devops.namespace" . }}-strip-api@kubernetescrd
spec:
  ingressClassName: {{ .Values.frontend.ingress.className | quote }}
  rules:
    - http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: users
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasks-api
  namespace: {{ include "bsc-devops.namespace" . }}
  labels:
    {{- include "bsc-devops.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "bsc-devops.namespace" . }}-strip-api-tasks@kubernetescrd
spec:
  ingressClassName: {{ .Values.frontend.ingress.className | quote }}
  rules:
    - http:
        paths:
          - path: /api/tasks
            pathType: Prefix
            backend:
              service:
                name: tasks
                port:
                  number: 8080
{{- end }}
