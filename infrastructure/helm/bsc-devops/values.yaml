global:
  namespace: bsc-devops

nameOverride: ""
fullnameOverride: ""

# Global image tag — overridden per-service via image.tag
imageTag: "latest"

# Pull secret attached to every ServiceAccount (auto-applied to all pods).
# Materialized in-cluster from gitops/secrets/dockerhub-pull-secret.sealed.yaml
imagePullSecrets:
  - name: dockerhub-pull-secret

rbac:
  # Minimal namespaced Role bound to all app ServiceAccounts.
  # Workloads do not call the Kubernetes API (automountServiceAccountToken: false),
  # so this grants only read on ConfigMaps to demonstrate least privilege.
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]

observability:
  pulsarServiceUrl: "pulsar://pulsar:6650"
  otelEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"

postgres:
  enabled: true
  image: "postgres:16-alpine"
  credentials:
    database: "todo"
    username: "todo"
    # password is NOT stored here — provided via sealed Secrets:
    #   gitops/secrets/db-secret.sealed.yaml       (QUARKUS_DATASOURCE_PASSWORD)
    #   gitops/secrets/postgres-secret.sealed.yaml (POSTGRES_PASSWORD)
  storage:
    size: "5Gi"
    storageClass: "local-path"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

pulsar:
  enabled: true
  image: "apachepulsar/pulsar:3.3.1"
  mem: "-Xms256m -Xmx768m -XX:MaxDirectMemorySize=512m"
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

users:
  enabled: true
  image:
    repository: "docker.io/mateuszwas/users"
    tag: "1.2.0"
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

tasks:
  enabled: true
  image:
    repository: "docker.io/mateuszwas/tasks"
    tag: "1.2.0"
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

taskArchiver:
  enabled: true
  image:
    repository: "docker.io/mateuszwas/task-archiver"
    tag: "1.2.0"
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

frontend:
  enabled: true
  image:
    repository: "docker.io/mateuszwas/frontend"
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"
  ingress:
    enabled: true
    className: "traefik"
    host: ""
