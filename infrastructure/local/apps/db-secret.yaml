# LOCAL DEV ONLY — plaintext credentials for offline `kubectl apply -f` workflows.
# The GitOps/Helm delivery path uses encrypted Sealed Secrets instead:
# gitops/secrets/db-secret.sealed.yaml and gitops/secrets/postgres-secret.sealed.yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: bsc-devops
  labels:
    app.kubernetes.io/part-of: bsc-devops
type: Opaque
stringData:
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/todo"
  QUARKUS_DATASOURCE_USERNAME: "todo"
  QUARKUS_DATASOURCE_PASSWORD: "todo"
