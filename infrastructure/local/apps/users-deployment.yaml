apiVersion: v1
kind: ServiceAccount
metadata:
  name: users-sa
  namespace: bsc-devops
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: bsc-devops
automountServiceAccountToken: false
imagePullSecrets:
  - name: dockerhub-pull-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: bsc-devops
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: bsc-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: users
      app.kubernetes.io/part-of: bsc-devops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users
        app.kubernetes.io/part-of: bsc-devops
    spec:
      serviceAccountName: users-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: users
          image: docker.io/mateuszwas/users:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: db-secret
            - configMapRef:
                name: app-config
          env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: bsc-devops
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: bsc-devops
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /q/metrics
    prometheus.io/port: "8080"
spec:
  selector:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: bsc-devops
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
