apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-archiver-sa
  namespace: bsc-devops
  labels:
    app.kubernetes.io/name: task-archiver
    app.kubernetes.io/part-of: bsc-devops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-archiver
  namespace: bsc-devops
  labels:
    app.kubernetes.io/name: task-archiver
    app.kubernetes.io/part-of: bsc-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-archiver
      app.kubernetes.io/part-of: bsc-devops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-archiver
        app.kubernetes.io/part-of: bsc-devops
    spec:
      serviceAccountName: task-archiver-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: task-archiver
          image: docker.io/mateuszwas/task-archiver:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - secretRef:
                name: db-secret
            - configMapRef:
                name: app-config
          env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: task-archiver
  namespace: bsc-devops
  labels:
    app.kubernetes.io/name: task-archiver
    app.kubernetes.io/part-of: bsc-devops
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /q/metrics
    prometheus.io/port: "8082"
spec:
  selector:
    app.kubernetes.io/name: task-archiver
    app.kubernetes.io/part-of: bsc-devops
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP
