# Minimal namespaced RBAC for the local (non-Helm) manifests.
# Mirrors infrastructure/helm/bsc-devops/templates/rbac.yaml.
# Workloads do not call the Kubernetes API (automountServiceAccountToken: false);
# this grants only read on ConfigMaps to demonstrate least privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bsc-devops-app
  namespace: bsc-devops
  labels:
    app.kubernetes.io/part-of: bsc-devops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bsc-devops-app
  namespace: bsc-devops
  labels:
    app.kubernetes.io/part-of: bsc-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bsc-devops-app
subjects:
  - kind: ServiceAccount
    name: users-sa
    namespace: bsc-devops
  - kind: ServiceAccount
    name: tasks-sa
    namespace: bsc-devops
  - kind: ServiceAccount
    name: task-archiver-sa
    namespace: bsc-devops
  - kind: ServiceAccount
    name: postgres-sa
    namespace: bsc-devops
  - kind: ServiceAccount
    name: pulsar-sa
    namespace: bsc-devops
  - kind: ServiceAccount
    name: jaeger-sa
    namespace: bsc-devops
