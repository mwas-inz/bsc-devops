apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsar-sa
  namespace: bsc-devops
  labels:
    app: pulsar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: bsc-devops
  labels:
    app: pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      serviceAccountName: pulsar-sa
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:3.3.1
          command: ["bin/pulsar", "standalone"]
          ports:
            - containerPort: 6650
              name: broker
            - containerPort: 8080
              name: admin
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /admin/v2/brokers/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /admin/v2/brokers/ready
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
