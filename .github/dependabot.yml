version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directories:
      - "/apps/users"
      - "/apps/tasks"
      - "/apps/task-archiver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "apps/frontend"
    schedule:
      interval: "weekly"
