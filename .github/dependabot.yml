version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/apps/users"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/apps/tasks"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/apps/task-archiver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
