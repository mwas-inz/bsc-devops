name: Thesis

on:
  push:
    branches: [main]
    paths:
      - thesis/**
      - scripts/thesis/**
      - .github/workflows/thesis.yml
  pull_request:
    branches: [main]
    paths:
      - thesis/**
      - scripts/thesis/**
      - .github/workflows/thesis.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Compile LaTeX → PDF
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Compile thesis (LuaLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: main.tex
          latexmk_use_lualatex: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-${{ github.sha }}
          path: thesis/main.pdf
          retention-days: 90
