name: Frontend Release

on:
  push:
    tags:
      - 'frontend-v*'

jobs:
  retag:
    name: Retag & Sign — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Parse tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#frontend-v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SHA image
        run: |
          for i in 1 2 3 4 5; do
            docker pull ghcr.io/mwas-inz/frontend:${{ github.sha }} && break
            echo "Attempt $i failed, retrying in 60s..."
            sleep 60
          done

      - name: Tag and push SemVer
        run: |
          docker tag ghcr.io/mwas-inz/frontend:${{ github.sha }} \
                     ghcr.io/mwas-inz/frontend:${{ steps.meta.outputs.version }}
          docker push ghcr.io/mwas-inz/frontend:${{ steps.meta.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign SemVer image
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/mwas-inz/frontend:${{ steps.meta.outputs.version }} \
            --format '{{.Manifest.Digest}}')
          cosign sign --yes \
            ghcr.io/mwas-inz/frontend@${DIGEST}
