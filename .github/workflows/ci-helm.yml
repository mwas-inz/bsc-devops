name: CI — Helm

on:
  push:
    branches: [main]
    paths:
      - infrastructure/helm/**
      - .github/workflows/ci-helm.yml
  pull_request:
    branches: [main]
    paths:
      - infrastructure/helm/**
      - .github/workflows/ci-helm.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Validate — Helm
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CHART: infrastructure/helm/bsc-devops
      KUBECONFORM_VERSION: "0.6.7"
      K8S_VERSION: "1.35.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint ${{ env.CHART }}

      - name: Render templates
        run: helm template bsc-devops ${{ env.CHART }} --set imageTag=ci --debug > /dev/null

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: |
          helm template bsc-devops ${{ env.CHART }} --set imageTag=ci \
            | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version ${{ env.K8S_VERSION }} \
              --summary

  tag:
    name: Tag — chart-<version>
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' infrastructure/helm/bsc-devops/Chart.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push git tag
        env:
          TAG: chart-${{ steps.chart.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
