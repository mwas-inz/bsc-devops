name: Release

on:
  push:
    tags:
      - 'users-v*'
      - 'tasks-v*'
      - 'task-archiver-v*'
      - 'frontend-v*'

jobs:
  retag:
    name: Retag & Sign — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Parse tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          SERVICE="${TAG%%-v*}"
          VERSION="${TAG#*-v}"
          echo "service=${SERVICE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull SHA image
        run: |
          for i in 1 2 3 4 5; do
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.service }}:${{ github.sha }} && break
            echo "Attempt $i failed, retrying in 60s..."
            sleep 60
          done

      - name: Tag and push SemVer
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.service }}:${{ github.sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.service }}:${{ steps.meta.outputs.version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.service }}:${{ steps.meta.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign SemVer image
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.service }}:${{ steps.meta.outputs.version }} \
            --format '{{.Manifest.Digest}}')
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.service }}@${DIGEST}
