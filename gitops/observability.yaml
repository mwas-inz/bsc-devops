apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    # OCI Helm chart published to GHCR by cd-helm. The LGTM community subcharts are
    # bundled into the package at build time, so ArgoCD renders it without resolving
    # dependencies at sync time.
    repoURL: ghcr.io/mwas-inz/charts
    chart: bsc-devops-observability
    targetRevision: "0.2.1"
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Server-side apply avoids the client-side last-applied annotation size limit
      # that large Grafana/Prometheus resources can exceed.
      - ServerSideApply=true
